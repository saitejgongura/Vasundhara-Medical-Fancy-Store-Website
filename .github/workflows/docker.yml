name: Vasundhara Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }} \
            -t saitejgongura/vasundhara-medical:latest .

      - name: Push Docker Image
        run: docker push saitejgongura/vasundhara-medical:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull saitejgongura/vasundhara-medical:latest
            sudo docker stop vasundhara-web || true
            sudo docker rm vasundhara-web || true
            sudo docker run -d \
              --name vasundhara-web \
              --restart unless-stopped \
              -p 80:80 \
              saitejgongura/vasundhara-medical:latest
